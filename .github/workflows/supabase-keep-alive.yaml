name: Supabase Keep Alive

on:
  schedule:
    # Every 4 hours (UTC); one ping a day fell below Supabase's "a few requests each day" activity bar.
    - cron: '0 */4 * * *'

jobs:
  ping_supabase:
    runs-on: ubuntu-latest

    steps:
      - name: External ping to Supabase
        run: |
          curl -sf -o /dev/null -w "%{http_code}" \
            "https://unxvjlpvplhpdynmakmx.supabase.co/rest/v1/bookings?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
